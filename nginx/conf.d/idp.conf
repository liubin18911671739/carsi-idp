# =============================================================================
# nginx —— CARSI IdP 反向代理（TLS 终止 + 强制 HTTPS）
#   公网 443 -> idp:8080    ; CARSI 要求 IdP 必须 HTTPS 且证书受信
#   注意: X-Forwarded-Proto / Host 必须正确传递，否则 IdP 生成的重定向 URL 会错
# =============================================================================

# 上游 IdP（compose 服务名: idp，容器内 Jetty 监听 8080）
upstream idp_backend {
    server idp:8080;
    keepalive 16;
}

# HTTP -> HTTPS 强制跳转（CARSI 要求 443 且不得明文）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/idp.crt;
    ssl_certificate_key /etc/nginx/certs/idp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 安全响应头（Shibboleth 建议；不要加 HSTS preload，先观察）───────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 10m;

    # ── 代理到 Jetty ─────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://idp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering    off;
    }

    # ── IdP 状态端点（本地健康检查，不对外暴露细节）──────────────────────────
    location = /idp/status {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://idp_backend;
        proxy_set_header Host $host;
    }

    # ── backchannel（SAML 属性查询 / SOAP）──────────────────────────────────
    #   注意: 官方建议 backchannel 只对 SP 网段开放，公网暴露有风险。
    #   如无 SOAP 需求，直接注释掉此 location。
    location /idp/profile/SAML2/SOAP/ {
        # allow <SP 网段>; deny all;
        proxy_pass         http://idp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
    }
}
